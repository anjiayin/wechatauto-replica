<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>账号 · 授权服务后台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="nav"></div>
<main class="wrap">
  <h1>账号设置</h1>

  <div class="card" id="first-tip" style="display:none">
    <strong>首次登录必须先修改初始密码。</strong>
    <p class="hint">在修改密码之前，除「改密 / 退出 / 当前用户」外的所有接口都会返回 403。</p>
  </div>

  <div class="card">
    <h2>修改密码</h2>
    <div class="row">
      <div class="field"><label for="old">原密码</label>
        <input id="old" type="password" maxlength="128"></div>
      <div class="field"><label for="new1">新密码（8–64 位，不含空格）</label>
        <input id="new1" type="password" maxlength="128"></div>
      <div class="field"><label for="new2">确认新密码</label>
        <input id="new2" type="password" maxlength="128"></div>
      <button class="btn" id="submit">保存</button>
    </div>
    <p class="hint">修改成功后其它终端的登录会立即失效，本页面需要重新登录。</p>
  </div>

  <div class="card">
    <h2>当前账号</h2>
    <div id="me"></div>
  </div>
</main>
<script src="app.js"></script>
<script>
(function () {
  'use strict';
  var h = LS.h;

  async function submit() {
    var oldPwd = document.getElementById('old').value;
    var newPwd = document.getElementById('new1').value;
    var confirmPwd = document.getElementById('new2').value;
    if (!oldPwd || !newPwd) { LS.toast('请填写原密码与新密码', true); return; }
    if (newPwd !== confirmPwd) { LS.toast('两次输入的新密码不一致', true); return; }
    var button = document.getElementById('submit');
    button.disabled = true;
    try {
      await LS.apiPost('/admin/api/password',
        { old_password: oldPwd, new_password: newPwd });
      LS.clearAuth();
      location.href = 'login.html?changed=1';
    } catch (e) {
      LS.showError(e);
    } finally {
      button.disabled = false;
    }
  }

  LS.bootPage('account').then(function (user) {
    if (!user) { return; }
    if (user.must_change_password || new URLSearchParams(location.search).get('first') === '1') {
      document.getElementById('first-tip').style.display = '';
    }
    var box = document.getElementById('me');
    box.replaceChildren(LS.table(['字段', '值'], [
      ['ID', String(user.id)],
      ['用户名', user.username],
      ['显示名', user.display_name || '-'],
      ['角色', user.role],
      ['需要改密', user.must_change_password ? '是' : '否']
    ]));
    document.getElementById('submit').addEventListener('click', submit);
    document.getElementById('new2').addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { submit(); }
    });
  });
}());
</script>
</body>
</html>
